# RichSlurmKit configuration.
# Edits to this file take effect on the next command -- no rebuild needed.
#
# REQUIRED EDITS before `v` or `p` will work:
#   - Replace every YOUR_* placeholder below (search for the string YOUR_).
#   - Sanity-check `partition:` names, `gres:` strings, and resource limits;
#     these vary by cluster.
#
# How to discover values for your cluster:
#   sshare -U $USER              # accounts you can charge to
#   sinfo -s                     # partitions + node counts
#   sinfo -p <part> -o "%N %G"   # GRES strings available in a partition
#   scontrol show partition <p>  # per-partition CPU / mem / time limits

# Cluster login host: the externally-reachable hostname for SSHing into this
# cluster from elsewhere, usually a public alias like `login.<cluster>.edu`.
# Used only by `p` to print the ssh-tunnel one-liner for off-cluster connections.
login_host: ""

# Conda env activated inside jupyter/vscode jobs. Make sure this env exists
# (conda create -n <name> ...) before submitting. Override per call with
# `v --env othername`.
conda_env: base

# Shell line that activates the env inside v/p jobs; {env} becomes the env name.
# The default suits conda when its bin/ is on PATH. For mamba 2:
#   activate: eval "$(mamba shell hook --shell bash)" && mamba activate {env}
# For a venv (ignores conda_env):
#   activate: source /path/to/venv/bin/activate
activate: source activate {env}

# Extra flags `c` passes to claude, and so to mc, mcr and mrevive. For example
# --dangerously-skip-permissions skips every permission prompt; some clusters
# forbid that for agents, so check your site's policy first.
claude_flags: ""

# `interactive` command (CPU srun shell) defaults. If your cluster requires
# `-A`, set `account:` here; otherwise leave blank.
interactive:
  account: ""
  partition: shared              # REPLACE: many clusters don't have a 'shared' partition
  cores: 2
  mem: 24G
  time: "48:00:00"               # always quote HH:MM:SS (else YAML parses as sexagesimal)

# Which preset a bare `v` / `p` (no numeric argument) uses. Accepts a preset
# NAME or a 1-based index. If unset/empty or it matches no preset, falls back
# to the first preset. A numeric `v 2` always overrides this.
default_preset: gpu_h100

# Presets for `v` and `p`. A bare `v` uses `default_preset` above (falling back
# to the first preset). Pass `v 2` etc. to select a preset by index.
# Override individual fields per call with --account, --partition, --gres,
# --cores, --mem, --time, --env.
presets:
  - name: gpu_h100
    account:   YOUR_GPU_ACCOUNT          # REPLACE
    partition: YOUR_H100_PARTITION       # REPLACE (or remove this preset if no H100s)
    gres: gpu:1                          # some clusters need 'gpu:h100:1' or similar
    cores: 24
    mem: 360G
    time: "0-48:00:00"
    # conda_env: myenv                   # optional; overrides the global conda_env for this preset

  - name: gpu_a100
    account:   YOUR_GPU_ACCOUNT          # REPLACE
    partition: YOUR_A100_PARTITION       # REPLACE
    gres: gpu:1
    cores: 16
    mem: 240G
    time: "0-48:00:00"

  - name: gpu_h200
    account:   YOUR_GPU_ACCOUNT          # REPLACE
    partition: YOUR_H200_PARTITION       # REPLACE (or remove if no H200s)
    gres: gpu:1
    cores: 16
    mem: 360G
    time: "0-48:00:00"

  - name: gpu_rtx
    account:   YOUR_GPU_ACCOUNT          # REPLACE
    partition: YOUR_RTX_PARTITION        # REPLACE (or remove if no RTX nodes)
    gres: gpu:1
    cores: 16
    mem: 64G                             # keep tight: some sites bill RTX memory heavily
    time: "0-48:00:00"

  - name: gpu_preempt
    account:   YOUR_GPU_ACCOUNT          # REPLACE
    partition: YOUR_PREEMPT_PARTITION    # REPLACE (or delete this preset)
    gres: gpu:1
    cores: 16
    mem: 240G
    time: "0-48:00:00"

  - name: shared_cpu
    account:   YOUR_CPU_ACCOUNT          # REPLACE
    partition: shared                    # REPLACE if your cluster's CPU partition has a different name
    gres: ""
    cores: 16
    mem: 100G
    time: "0-48:00:00"

  # Long-lived CPU host for Claude Code sessions (zmx `m*` helpers) + the VS Code
  # tunnel. Pick a partition that allows multi-day runs (on FASRC Cannon:
  # `intermediate`, up to 14 days). Select with `v agent_host`.
  - name: agent_host
    account:   YOUR_CPU_ACCOUNT          # REPLACE
    partition: YOUR_LONG_CPU_PARTITION   # REPLACE
    gres: ""
    cores: 8
    mem: 32G
    time: "14-00:00:00"

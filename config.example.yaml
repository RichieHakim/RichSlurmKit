# RichSlurmKit configuration.
# Edits to this file take effect on the next command — no rebuild needed.

# Cluster login host: the externally-reachable hostname for SSHing into this
# cluster from elsewhere. Used only by `p` to print the ssh-tunnel one-liner
# for off-cluster connections. The installer auto-fills `hostname -f` on
# first run; override here if your cluster uses a different public alias.
login_host: ""

# Default conda env activated inside jupyter/vscode jobs.
# Override per-call with `v --env myenv`.
conda_env: base

# `interactive` command resource defaults (CPU srun).
interactive:
  account: ""
  partition: shared
  cores: 2
  mem: 24G
  time: "48:00:00"

# Presets for `v` and `p`. First preset is the default
# (i.e. bare `v` == `v 1`). Pass `v 2` etc. to use other presets.
# Override individual fields with --account, --partition, --gres,
# --cores, --mem, --time, --env.
#
# NOTE: always quote HH:MM:SS / D-HH:MM:SS time values. Unquoted, YAML
# parses `48:00:00` as the integer 172800 (sexagesimal). Same for any
# value containing a colon you want kept as a string.
presets:
  - name: gpu_h100
    account: YOUR_GPU_ACCOUNT
    partition: YOUR_H100_PARTITION
    gres: gpu:1
    cores: 24
    mem: 360G
    time: "0-48:00:00"

  - name: gpu_a100
    account: YOUR_GPU_ACCOUNT
    partition: YOUR_A100_PARTITION
    gres: gpu:1
    cores: 16
    mem: 240G
    time: "0-48:00:00"

  - name: gpu_preempt
    account: YOUR_GPU_ACCOUNT
    partition: YOUR_PREEMPT_PARTITION
    gres: gpu:1
    cores: 16
    mem: 240G
    time: "0-48:00:00"

  - name: shared_cpu
    account: YOUR_CPU_ACCOUNT
    partition: shared
    gres: ""
    cores: 16
    mem: 100G
    time: "0-48:00:00"
